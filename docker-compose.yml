# Optional local infrastructure (PostgreSQL + Redis) via Docker Compose.
# Use this only if Docker is available. Otherwise, run these services natively.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pagepilot
      POSTGRES_PASSWORD: pagepilot
      POSTGRES_DB: pagepilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
