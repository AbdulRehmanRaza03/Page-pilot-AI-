<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" fill="none" role="img" aria-label="PagePilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="icon" x1="72" y1="40" x2="152" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="24" fill="url(#bg)"/>

  <!-- Subtle decorative circles -->
  <circle cx="700" cy="40" r="90" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="60" cy="210" r="70" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="480" cy="200" r="40" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Logo icon: paper plane (messenger) -->
  <g transform="translate(48, 40)">
    <path d="M100 0 L128 80 L52 44 L100 60 L148 44 L72 80 Z" fill="url(#icon)" stroke="#C7D2FE" stroke-width="2" stroke-linejoin="round"/>
    <path d="M100 28 L56 52 L72 88 L100 62 Z" fill="#4F46E5" opacity="0.35"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="120" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">PagePilot</text>
  <text x="212" y="170" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#E0E7FF">AI‑powered Facebook Page automation</text>
</svg>
